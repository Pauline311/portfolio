  <!-- AOS (Animate on Scroll) -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <script>
    document.addEventListener("DOMContentLoaded", function () {

  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background-color: var(--bg-color, #f0f4f8);
      color: var(--text-color, #1f2937);
      transition: background-color 0.3s, color 0.3s;
    }
    .navbar {
      background-color: var(--nav-color, #0f172a);
    }
    .navbar .nav-link, .navbar .navbar-brand {
      color: #fff !important;
    }
    .btn-dark-mode {
      margin-left: 10px;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
    }
    /* === Tech Cards === */
    .tech-card {
      position: relative;
      padding: 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .tech-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 2px;
      background: linear-gradient(135deg, #0d9488, #14b8a6, #06b6d4);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
    }
    .tech-card:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 12px 25px rgba(6, 182, 212, 0.4);
    }
    .tech-card img {
      width: 60px;
      margin-bottom: 10px;
    }
    .tech-card p {
      margin: 0;
      font-weight: 600;
    }
    /* === Progress Bars === */
    .progress {
      height: 6px;
      width: 100%;
      background: rgba(200, 200, 200, 0.2);
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #0d9488, #14b8a6, #06b6d4);
      border-radius: 9999px;
      transition: width 1s ease-in-out;
    }
    /* === Dark/Light Mode Adaptation === */
    body.dark {
      --bg-color: #1f2937;
      --text-color: #f0f4f8;
      --nav-color: #1e293b;
    }
    body.light {
      --bg-color: #f0f4f8;
      --text-color: #1f2937;
      --nav-color: #0f172a;
    }
  </style>
</head>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggleBtn = document.getElementById("darkModeToggle");
    const body = document.body;
    body.classList.add("light"); // default mode

    toggleBtn.addEventListener("click", () => {
      body.classList.toggle("dark");
      body.classList.toggle("light");
    });

    if (typeof particlesJS !== 'undefined') {
      particlesJS("particles-js", {
        particles: {
          number: { value: 80, density: { enable: true, value_area: 800 } },
          color: { value: "#0d9488" },
          shape: { type: "circle", stroke: { width: 0 }, polygon: { nb_sides: 5 } },
          opacity: { value: 0.4 },
          size: { value: 3, random: true },
          line_linked: {
            enable: true,
            distance: 150,
            color: "#0d9488",
            opacity: 0.5,
            width: 1
          },
          move: { enable: true, speed: 4, out_mode: "out" }
        },
        interactivity: {
          events: {
            onhover: { enable: true, mode: "repulse" },
            onclick: { enable: true, mode: "push" },
            resize: true
          },
          modes: {
            repulse: { distance: 200, duration: 0.4 },
            push: { particles_nb: 4 }
          }
        },
        retina_detect: true
      });
    }
  </script>
